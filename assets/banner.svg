<text x="64" y="228" font-family="Arial,sans-serif" font-size="25" fill="#426887">Before you trust it, price it, or leave it behind.</text>
<g font-family="Arial,sans-serif"><rect x="64" y="292" width="330" height="104" rx="16" fill="#096aca"/><text x="88" y="333" font-size="22" fill="white">01  Review</text><text x="88" y="365" font-size="17" fill="#e2f3ff">Find what needs a second look.</text><rect x="418" y="292" width="330" height="104" rx="16" fill="#d4edff"/><text x="442" y="333" font-size="22" fill="#096aca">02  Costs</text><text x="442" y="365" font-size="17" fill="#426887">Put a number on API usage.</text><rect x="772" y="292" width="364" height="104" rx="16" fill="#dcefff"/><text x="796" y="333" font-size="22" fill="#096aca">03  Handoff</text><text x="796" y="365" font-size="17" fill="#426887">Leave the next session a trail.</text></g></svg>
